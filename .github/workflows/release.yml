name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # A release tag that disagrees with the package version produces
      # artifacts nobody can identify later. Fail before building.
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version v$version" >&2
            exit 1
          fi

      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build the Python package
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel and smoke-test the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/himin --help > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build the VS Code extension
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npm run package

      - name: Check the release artifacts
        run: |
          test -s extension/himinbjorg.vsix
          ls -lh dist extension/himinbjorg.vsix

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            extension/himinbjorg.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
