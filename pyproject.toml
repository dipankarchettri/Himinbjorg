[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "himinbjorg"
version = "0.6.3"
description = "Token-efficient coding agent on the Bifrost LLM gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["openai>=3.51,<4", "prompt_toolkit>=3.0.43,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
himin = "agent.main:main"
bfa = "agent.main:main"  # short alias

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["bench"]
# Fixture and seed repositories hold deliberately broken code for the agent
# to fix; their tests are meant to fail. Every other bench/test_*.py runs,
# so a new test file cannot be left out by a list that forgot it.
norecursedirs = [".*", "fixtures", "seed", "seed-confidential", "node_modules", "build", "dist"]
python_files = ["test_*.py"]
